services:
  # 1. FastAPI Web Backend
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: draftgpt_api
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - .:/app
      - cad_uploads:/app/uploads
      - cad_output:/app/output
    depends_on:
      - redis
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --reload

  # 2. Redis Message Broker
  redis:
    image: redis:7-alpine
    container_name: draftgpt_redis
    ports:
      - "6379:6379"

  # 3. Celery Background Worker
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: draftgpt_worker
    environment:
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - .:/app
      - cad_uploads:/app/uploads
      - cad_output:/app/output
    depends_on:
      - redis
    command: celery -A draftgpt_core.tasks.celery_app worker --loglevel=info

volumes:
  cad_uploads:
  cad_output: